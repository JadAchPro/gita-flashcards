<title>Vocabulaires : accès</title>
<style>
:root { --bg:#faf7f2; --card:#fff; --ink:#2b2620; --muted:#8a7f70; --line:#e8e1d5; --accent:#b0562b; --err:#c0392b; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16130f; --card:#211d17; --ink:#ece5da; --muted:#9a8f7f; --line:#373026; --accent:#e0794a; --err:#e06050; }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 24px;
  max-width:360px; width:100%; text-align:center; box-shadow:0 2px 12px rgba(60,45,20,.08); }
.glyphs { font-size:2rem; margin-bottom:10px; color:var(--accent); }
h1 { font-size:1.05rem; font-weight:600; margin-bottom:18px; }
input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
  background:var(--bg); color:var(--ink); font-family:inherit; font-size:1rem; text-align:center; margin-bottom:10px; }
button { width:100%; padding:13px; border:none; border-radius:10px; background:var(--accent); color:#fff;
  font-family:inherit; font-size:1rem; cursor:pointer; }
.msg { font-size:.85rem; color:var(--muted); margin-top:12px; min-height:1.2em; }
.msg.err { color:var(--err); }
</style>
</head>

</div>

const BUILD = "20260808-150252";
const KEY_LS = "gitaGate.key";

// Auto-mise a jour : contourne le cache agressif iOS (icone « ajouter a l'ecran d'accueil »).
// A chaque ouverture, on lit version.txt en ligne ; si une version plus recente existe,
// on recharge la page avec un parametre anti-cache pour forcer le telechargement du nouveau site.
(async () => {
  try {
    const r = await fetch("version.txt?cb=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const latest = (await r.text()).trim();
    if (!latest || latest === BUILD) return;
    if (sessionStorage.getItem("fcReloadedFor") === latest) return; // deja tente : evite toute boucle
    sessionStorage.setItem("fcReloadedFor", latest);
    location.replace(location.pathname + "?v=" + encodeURIComponent(latest));
  } catch (e) { /* hors ligne : on garde la version en cache, pas de blocage */ }
})();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = (t, err) => { const m = document.getElementById("msg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); };

async function deriveKey(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function openWith(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function tryPassword(pw) {
  msg("Déchiffrement…");
  try {
    const key = await deriveKey(pw);
    const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
    await openWith(key);
    localStorage.setItem(KEY_LS, raw);
  } catch {
    msg("Mot de passe incorrect.", true);
  }
}
document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  tryPassword(document.getElementById("pw").value);
});
// Deverrouillage automatique si la cle est deja memorisee sur cet appareil
(async () => {
  const saved = localStorage.getItem(KEY_LS);
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
    await openWith(key);
  } catch {
    localStorage.removeItem(KEY_LS);
  }
})();
